<section class="category-section">

  <div class="section-heading">
    <div class="heading-content">
      <span class="eyebrow">EXPLORA POR ÁREAS</span>
      <h2>¿Qué necesitas?</h2>
      <p>Selecciona una área para encontrar los recursos disponibles.</p>
    </div>

    <a routerLink="/areas">
      Ver todas las áreas
      <i class="bi bi-arrow-right"></i>
    </a>
  </div>

  <div class="category-grid">

    @for (categoria of categorias(); track categoria.id; let i = $index) {

    <button class="category-card" type="button" (click)="navigateToCategory(categoria.id)">

      <span class="category-icon" aria-hidden="true">

        @switch (i % 6) {
        @case (0) {
        <i class="bi bi-clipboard-check-fill"></i>
        }
        @case (1) {
        <i class="bi bi-briefcase-fill"></i>
        }
        @case (2) {
        <i class="bi bi-mortarboard-fill"></i>
        }
        @case (3) {
        <i class="bi bi-person-wheelchair"></i>
        }
        @case (4) {
        <i class="bi bi-heart-pulse-fill"></i>
        }
        @case (5) {
        <i class="bi bi-person-raised-hand"></i>
        }
        }

      </span>

      <span class="category-name">
        {{ categoria.nombre }}
      </span>

    </button>

    }

  </div>

</section>
